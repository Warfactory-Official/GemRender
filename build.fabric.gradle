// The Fabric half of GemRender's build.
//
// Kept separate from build.gradle rather than branched into it: Loom's DSL shares nothing with
// ModDevGradle's -- no `mods {}`, no `runs {}` of that shape, no `addModdingDependenciesTo` -- so a
// third branch through those blocks would touch every one of them. build.gradle hands off to this
// file for a node whose loader is 'fabric' and returns, which is what keeps the Forge and NeoForge
// builds exactly as they were.
//
// This node carries the loader-neutral core: the model pipeline, the animation drivers and the
// particle system. The subsystems that reach for loader events -- water split, direct render, Iris,
// the harness and the bench -- are off in its gradle.properties and compile out.

apply plugin: 'dev.kikugie.loom-back-compat'

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${stonecutter.current.version}"
}

def mcVersion = stonecutter.current.version

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

stonecutter.constants.match(loader, 'forge', 'neoforge', 'fabric')

// Loom puts two LWJGLs on the 1.20.1 runtime classpath -- Minecraft's own 3.3.1 and a 3.3.2 of its
// own -- and Gradle's conflict resolution takes the higher, so the dev client ran against an LWJGL
// the game does not ship. Nothing noticed until Sodium's driver scanner refused to start at all:
// "Installed version: 3.3.2-snapshot, Required version: 3.3.1". lwjgl_version is what this
// Minecraft actually uses -- the ModDevGradle nodes resolve it on their own -- so pin to it.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        // lwjgl-ktx exempt: ktx_version, no 3.3.1 build exists.
        if (details.requested.group == 'org.lwjgl' && details.requested.name != 'lwjgl-ktx') {
            details.useVersion lwjgl_version
        }
    }
}

def ktxPlatforms = ['natives-linux', 'natives-windows', 'natives-macos', 'natives-macos-arm64']

stonecutter.constants.put('iris', iris_supported.toBoolean())
stonecutter.constants.put('water', water_supported.toBoolean())
stonecutter.constants.put('lights', lights_supported.toBoolean())
stonecutter.constants.put('direct', direct_supported.toBoolean())

stonecutter.replacements.string(stonecutter.eval(mcVersion, '>=26.1')) {
    replace('ResourceLocation', 'Identifier')
    replace('com.mojang.blaze3d.platform.GlStateManager', 'com.mojang.blaze3d.opengl.GlStateManager')
    replace('net.minecraft.client.renderer.RenderType', 'net.minecraft.client.renderer.rendertype.RenderType')

    replace('net.minecraft.client.renderer.LightTexture', 'net.minecraft.util.LightCoordsUtil')
    replace('LightTexture.FULL_BRIGHT', 'LightCoordsUtil.FULL_BRIGHT')
    replace('net.minecraft.client.GraphicsStatus', 'net.minecraft.client.GraphicsPreset')
    replace('options.graphicsMode()', 'options.graphicsPreset()')
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
        content { includeGroup 'dev.engine-room.flywheel' }
    }
    // Iris, Sodium and the two Flywheel/Iris bridges. Same repository, same project slugs and --
    // apart from the loader suffix in the version string -- the same artifacts build.gradle names.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

def internalDir = rootProject.file(project.findProperty('internalDir') ?: '../gemrender-internal')

def irisSupported = iris_supported.toBoolean()

def benchSupported = bench_supported.toBoolean()
def benchEnabled = project.hasProperty('bench') || project.hasProperty('rival')
def rivalName = project.hasProperty('rival') ? project.property('rival').toString() : null

configurations {
    // Staged into run/mods rather than compiled against, so these stay unremapped: a released Fabric
    // mod jar is in intermediary names and Fabric Loader remaps it itself when the dev run starts.
    // Handing them to modImplementation would remap them here and leave loader nothing to map.
    shaderMod

    // The Colorwheel bridge, resolved only when -Pcolorwheel asks for it: it and iris-flw-compat do
    // the same job and cannot be installed together.
    colorwheelMod

    // Sodium without Iris, staged by -Psodium (gradle/shader-mods.gradle), as build.gradle does.
    sodiumMod
}

// Loom split at the obfuscation boundary: below 26.1 a mod dependency has to be remapped before it
// can be compiled against, at 26.1 and above it is already in Mojang names.
def obfuscated = !stonecutter.eval(mcVersion, '>=26.1')
def modCfg = { String notation -> dependencies.add(obfuscated ? 'modImplementation' : 'implementation', notation) }
def modCompileCfg = { String notation -> dependencies.add(obfuscated ? 'modCompileOnly' : 'compileOnly', notation) }
def devRuntime = { String notation -> dependencies.add(obfuscated ? 'modLocalRuntime' : 'localRuntime', notation) }

dependencies {
    add('minecraft', "com.mojang:minecraft:${minecraft_version}")
    if (obfuscated) add('mappings', loom.officialMojangMappings())

    modCfg("net.fabricmc:fabric-loader:${fabric_loader_version}")
    modCfg("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

    // Flywheel is the instancing engine every visual in this mod is written against. Published for
    // the obfuscated era; 26.1 has none, which is what flywheel_vendored is for.
    if (!flywheel_vendored.toBoolean() && flywheel_artifact) {
        // The full jar, not the -api slice: GemRender mixes into the backend's draw managers, and
        // those classes are not in the api artifact.
        modCompileCfg("dev.engine-room.flywheel:flywheel-fabric-${mcVersion}:${flywheel_version}")
        devRuntime("dev.engine-room.flywheel:flywheel-fabric-${mcVersion}:${flywheel_version}")
        // Nested like NeoForge's jarJar: Loader keeps the newest copy, so Create's or one in mods/ wins.
        include("dev.engine-room.flywheel:flywheel-fabric-${mcVersion}:${flywheel_version}")
    }

    if (project.findProperty('sodium_standalone_version')) {
        sodiumMod("maven.modrinth:sodium:${sodium_standalone_version}") { transitive = false }
    }

    if (irisSupported) {
        shaderMod("maven.modrinth:sodium:${sodium_version}") { transitive = false }
        shaderMod("maven.modrinth:iris:${iris_version}") { transitive = false }
        // Either bridge may be absent on a node: 1.20.1 has no iris-flw-compat built against
        // Flywheel 1.0 -- its newest Fabric build is for the old com.jozufozu Flywheel -- and
        // Colorwheel is what carries the shader path there instead.
        if (irisflw_version) {
            shaderMod("maven.modrinth:iris-flw-compat:${irisflw_version}") { transitive = false }
        }

        if (colorwheel_version) {
            colorwheelMod("maven.modrinth:colorwheel:${colorwheel_version}") { transitive = false }
        }

        // The one shader jar that IS compiled against: IrisPbrLoader implements Iris's
        // PBRTextureLoader. Remapped, unlike the staged copies above, because it has to read in the
        // same names as the rest of this source set.
        modCompileCfg("maven.modrinth:iris:${iris_version}")
        // Iris jar-in-jars it; the guest transform parses Iris's patched output with it.
        compileOnly("io.github.douira:glsl-transformer:${glsl_transformer_version}") { transitive = false }
    }

    // The KTX2/BC7 reader. Not a mod, so it needs no remapping on either side of the obfuscation
    // boundary: `include` is Loom's jar-in-jar, the counterpart of ModDevGradle's `jarJar`, and it
    // wraps a plain library in generated mod metadata on the way in. Only the ktx module is named --
    // LWJGL's core is already on Minecraft's own runtime classpath, and asking for a second copy of
    // it is how you get two Library instances fighting over the same natives directory.
    // ktx_version may exceed lwjgl_version: struct classes + natives only; calls via Libktx (libffi).
    compileOnly("org.lwjgl:lwjgl-ktx:${ktx_version}") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-ktx:${ktx_version}") { transitive = false }
    include("org.lwjgl:lwjgl-ktx:${ktx_version}") { transitive = false }

    for (platform in ktxPlatforms) {
        runtimeOnly("org.lwjgl:lwjgl-ktx:${ktx_version}:${platform}") { transitive = false }
        include("org.lwjgl:lwjgl-ktx:${ktx_version}:${platform}") { transitive = false }
    }
}

// KTX2 decoding tested against files the same library encoded in the same process, exactly as
// build.gradle runs it. The sources are shared; only the two configurations differ, so this is a
// copy rather than a shared script -- the two buildscripts are deliberately separate.
sourceSets {
    ktxTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    ktxTestImplementation platform('org.junit:junit-bom:5.11.3')
    ktxTestImplementation 'org.junit.jupiter:junit-jupiter'
    ktxTestImplementation 'org.assertj:assertj-core:3.26.3'
    ktxTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    ktxTestImplementation "org.lwjgl:lwjgl:${lwjgl_version}"
    ktxTestImplementation("org.lwjgl:lwjgl-ktx:${ktx_version}") { transitive = false }

    for (platform in ktxPlatforms) {
        ktxTestRuntimeOnly "org.lwjgl:lwjgl:${lwjgl_version}:${platform}"
        ktxTestRuntimeOnly("org.lwjgl:lwjgl-ktx:${ktx_version}:${platform}") { transitive = false }
    }
}

tasks.register('ktxTest', Test) {
    group = 'verification'
    description = 'KTX2 decoding, against files encoded by the same library in the same process.'
    testClassesDirs = sourceSets.ktxTest.output.classesDirs
    classpath = sourceSets.ktxTest.runtimeClasspath
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.named('check') { dependsOn tasks.named('ktxTest') }

// fabric.mod.json is generated rather than filtered in place. Loom scans every resources srcDir for
// one and parses what it finds, and the template is not valid JSON until the mixin list is expanded
// into it -- so a template sitting in a resources directory is a parse failure on every run. It
// lives under src/main/templates beside the NeoForge one instead, and only the generated copy is a
// resource.
def fabricMetadata = tasks.register('generateFabricModMetadata', ProcessResources) {
    from rootProject.file('src/main/templates/fabric')
    into layout.buildDirectory.dir('generated/fabric')
}

sourceSets {
    main {
        resources {
            srcDir fabricMetadata
        }
    }

    // The spike harness. ModDevGradle puts this source set into the dev run by naming it in
    // `mods {}`; Loom has no equivalent, so it goes on main's runtime classpath instead and reaches
    // the client the same way. It is not in the jar on either loader.
    harness {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }
}

if (harness_supported.toBoolean()) {
    sourceSets.main.runtimeClasspath += sourceSets.harness.output
} else {
    sourceSets.harness.java.setSrcDirs([])
    sourceSets.harness.resources.setSrcDirs([])
}

def flywheelVendored = flywheel_vendored.toBoolean()
if (flywheelVendored) {
    apply from: "${rootProject.projectDir}/gradle/flywheel-fabric.gradle"
}

// The cross-framework bench. Only the rival half of it is loader-bound: BenchClient, BenchGrid,
// BenchFrameTimer and all three drivers are plain Minecraft against plain rival API, and the one
// NeoForge-only file was BenchEvents. Of the three rivals only GeckoLib has a 1.21.1 Fabric build --
// MCglTF's newest Fabric release is for 1.19.3 and Simple Bedrock Models has never had one -- so
// -Prival=geckolib is the whole of the comparison here, and the other two drivers compile out.
if (benchEnabled && !benchSupported) {
    // Refused when the client starts rather than while the node is configured, for the reason
    // build.gradle's copy of this guard explains.
    tasks.matching { it.name.startsWith('runClient') }.configureEach {
        doFirst {
            throw new GradleException("-Pbench/-Prival: the cross-framework benchmark is not ported "
                    + "to Minecraft ${stonecutter.current.version} on Fabric. Run it on a version "
                    + "whose bench_supported is true, or see gemrender-internal/docs/MULTIVERSION.md.")
        }
    }
}

sourceSets {
    bench {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output +
                sourceSets.harness.output
        runtimeClasspath += sourceSets.main.compileClasspath + sourceSets.main.output +
                sourceSets.harness.output
    }
}

if (benchSupported) {
    // Loom's answer to ModDevGradle's obfuscation.createRemappingConfiguration: it gives this source
    // set its own modBench* configurations, so the rival is remapped for the bench's compile
    // classpath alone and never reaches main's.
    loom.createRemapConfigurations(sourceSets.bench)

    sourceSets.bench.java.exclude 'com/wf/gemrender/bench/BenchEvents.java'
    sourceSets.bench.java.exclude 'com/wf/gemrender/bench/McgltfDriver.java'
    sourceSets.bench.java.exclude 'com/wf/gemrender/bench/SbmDriver.java'
} else {
    sourceSets.bench.java.setSrcDirs([])
    sourceSets.bench.resources.setSrcDirs([])
}

if (benchEnabled && benchSupported) {
    sourceSets.main.runtimeClasspath += sourceSets.bench.output
}

dependencies {
    if (benchSupported) {
        def rivalMods = [geckolib: geckolib_version]

        if (rivalName != null && !rivalMods.containsKey(rivalName)) {
            throw new GradleException("-Prival=${rivalName}: not available on Fabric ${mcVersion}. "
                    + "Have: ${rivalMods.keySet()}. MCglTF's newest Fabric build is for 1.19.3 and "
                    + "Simple Bedrock Models is NeoForge only -- both run on the 1.21.1 NeoForge "
                    + "node instead.")
        }

        rivalMods.each { name, version ->
            add('modBenchCompileOnly', "maven.modrinth:${name}:${version}") { transitive = false }

            // Only the rival actually asked for goes on the runtime classpath: two model libraries
            // loaded at once is not the thing being measured.
            if (rivalName == name) {
                devRuntime("maven.modrinth:${name}:${version}")
                logger.lifecycle "Rival framework: ${name} ${version}"
            }
        }
    }
}

// The NeoForge/Forge half of the spike item's registration: a @SubscribeEvent class taking
// RegisterEvent. Its counterpart here is the Registry.register call and the
// BuiltinItemRendererRegistry binding in DirectSpike's Fabric init(), so the item, its renderer and
// its model files are NOT excluded any more -- -Pdirectitem, -Pdirecttotem and -Pdirecthand all
// run on this loader now. SpikeItems itself holds only the id, the properties and the instance.
sourceSets.harness.java.exclude 'com/wf/gemrender/spike/SpikeItemEvents.java'

if (!direct_supported.toBoolean()) {
    sourceSets.harness.java.exclude 'com/wf/gemrender/spike/DirectSpike.java'
    sourceSets.harness.java.exclude 'com/wf/gemrender/spike/SpikeItem.java'
    sourceSets.harness.java.exclude 'com/wf/gemrender/spike/SpikeItems.java'
    sourceSets.harness.resources.exclude 'assets/gemrender/items/**'
    sourceSets.harness.resources.exclude 'assets/gemrender/models/item/**'
}

// Two model files dress the one item and only one of them is ever right: items/spike.json plus
// spike_base.json are the 26.1 pair, models/item/spike.json the builtin/entity one before it. The
// wrong one is a resource-pack error on load, not a silent no-op. build.gradle chooses the same way.
if (harness_supported.toBoolean()) {
    if (stonecutter.eval(mcVersion, '>=26.1')) {
        sourceSets.harness.resources.exclude 'assets/gemrender/models/item/spike.json'
    } else {
        sourceSets.harness.resources.exclude 'assets/gemrender/items/**'
        sourceSets.harness.resources.exclude 'assets/gemrender/models/item/spike_base.json'
    }
}

// The same exclusions build.gradle applies, for the same flags. A subsystem that is off must not
// reach javac at all: its sources name loader events and Flywheel backend internals that are not on
// this node's classpath, and a `//? if` guard cannot remove a whole package.
if (!irisSupported) {
    sourceSets.main.java.exclude 'com/wf/gemrender/iris/**'
    sourceSets.main.java.exclude 'com/wf/gemrender/mixin/iris/**'
    sourceSets.main.resources.exclude 'gemrender.iris.mixins.json'
}

// Each bridge's mixins go in only when that bridge is resolvable here. A mixin named in a `required`
// config whose target class is missing is a load-time warning on every launch; a config naming a
// class that was never compiled is a hard failure.
if (!irisSupported || !irisflw_version) {
    sourceSets.main.java.exclude 'com/wf/gemrender/mixin/irisflw/**'
    sourceSets.main.resources.exclude 'gemrender.irisflw.mixins.json'
}

if (!irisSupported || !colorwheel_version) {
    sourceSets.main.java.exclude 'com/wf/gemrender/mixin/colorwheel/**'
    sourceSets.main.resources.exclude 'gemrender.colorwheel.mixins.json'
}

def directMixinSet = stonecutter.eval(mcVersion, '>=26.1') ? 'direct26' : 'direct'
['direct', 'direct26'].each { set ->
    if (!direct_supported.toBoolean() || set != directMixinSet) {
        sourceSets.main.java.exclude "com/wf/gemrender/mixin/${set}/**"
        sourceSets.main.resources.exclude "gemrender.${set}.mixins.json"
    }
}

if (!direct_supported.toBoolean()) {
    sourceSets.main.java.exclude 'com/wf/gemrender/direct/**'
}

// The 26.1 armour mixin asks NeoForge's IClientItemExtensions for the model, which Fabric does not
// have. Here a mod hands GemRenderArmorModel to Fabric API's ArmorRenderer instead.
if (direct_supported.toBoolean() && directMixinSet == 'direct26') {
    sourceSets.main.java.exclude 'com/wf/gemrender/mixin/direct26/EquipmentLayerRendererMixin.java'
}

// The annotated event subscribers, and the only parts of their subsystems that are Forge or
// NeoForge only: two are a class of @SubscribeEvent methods taking RenderLevelStageEvent, a type
// that does not exist here, and the third a client tick taking ClientTickEvent.Post. What they do is
// done on this loader by the classes in com/wf/gemrender/fabric/, which register the Fabric API
// events that land on the same instructions and call the same methods. build.gradle excludes that
// package for the mirror-image reason.
//
// Nothing else in any of the three subsystems is excluded. WaterSplit, WaterDepthPrepass, WaterSplitPrograms
// and every class under direct/ are loader-neutral once the event type is off their signatures --
// the split takes a LevelStage now, which either loader can fill, and the direct path's stage
// handlers carried no event data at all. The direct mixins target vanilla, not the loader.
sourceSets.main.java.exclude 'com/wf/gemrender/water/WaterSplitEvents.java'
sourceSets.main.java.exclude 'com/wf/gemrender/direct/DirectEvents.java'
sourceSets.main.java.exclude 'com/wf/gemrender/medium/CameraMediumEvents.java'
sourceSets.main.java.exclude 'com/wf/gemrender/iris/IrisPbrEvents.java'
sourceSets.main.java.exclude 'com/wf/gemrender/light/LightEvents.java'

// The mixins are NOT excluded either. gemrender.mixins.json names all nine unconditionally, and
// dropping a class here while leaving its name in a `required` config is a hard load failure;
// dropping DrawManagerMixin means no buffer is ever uploaded and nothing draws at all. The members
// that reach for WaterSplit are behind `//? if water` instead.
if (!lights_supported.toBoolean()) {
    sourceSets.main.java.exclude 'com/wf/gemrender/light/**'
    sourceSets.main.java.exclude 'com/wf/gemrender/mixin/light/**'
    sourceSets.main.resources.exclude 'gemrender.light.mixins.json'
    sourceSets.test.java.exclude 'com/wf/gemrender/light/**'
    sourceSets.harness.java.exclude 'com/wf/gemrender/spike/LightSpike.java'
}

if (!ui_supported.toBoolean()) {
    sourceSets.main.java.exclude 'com/wf/gemrender/ui/**'
    sourceSets.main.java.exclude 'com/wf/gemrender/mixin/ui/**'
    sourceSets.main.resources.exclude 'gemrender.ui.mixins.json'
    sourceSets.main.resources.exclude 'assets/gemrender/shaders/ui/**'
    sourceSets.test.java.exclude 'com/wf/gemrender/ui/**'
}

if (!water_supported.toBoolean()) {
    sourceSets.main.java.exclude 'com/wf/gemrender/water/WaterSplit.java'
    sourceSets.main.java.exclude 'com/wf/gemrender/water/WaterSplitPrograms.java'
    sourceSets.main.java.exclude 'com/wf/gemrender/water/WaterDepthPrepass.java'
}

def gameDir = rootProject.file(
        project.hasProperty('runDir') ? project.property('runDir').toString() : run_dir)

// Loom resolves a run's `runDir` against the SUBPROJECT directory, and it takes a String -- hand it
// an absolute path and it appends it, so the client lands in
// versions/<v>/<the whole absolute path>/ and quietly keeps its own saves and options there.
def gameDirPath = project.projectDir.toPath()
        .relativize(gameDir.toPath())
        .toString()

ext.harnessRunDir = gameDir
ext.harnessRenderDocCompat = stonecutter.eval(mcVersion, '>=26.1')
apply from: "${rootProject.projectDir}/gradle/harness-run.gradle"

// Same staging build.gradle gets, from the same script -- see the comment on the configurations
// above for the one thing that differs.
ext.shaderRunDir = gameDir
ext.shaderInternalDir = internalDir
apply from: "${rootProject.projectDir}/gradle/shader-mods.gradle"

loom {
    // Without this the harness's RESOURCES are invisible to the game. Loader builds a mod's resource
    // pack from the classpath roots its fabric.mod.json was found beside, so an extra source set on
    // the runtime classpath is loaded as code but contributes no assets: the spike item's model came
    // back as a FileNotFoundException while its class loaded fine. Naming both source sets here is
    // what writes fabric.classPathGroups for the run, which is Loader's way of being told that two
    // output directories are one mod. ModDevGradle's `mods {}` does the same job on the other side.
    mods {
        register(mod_id) {
            sourceSet sourceSets.main
            if (flywheelVendored) {
                sourceSet sourceSets.flywheel
                sourceSet sourceSets.flywheelFabric
            }
            if (harness_supported.toBoolean()) {
                sourceSet sourceSets.harness
            }
            if (benchEnabled && benchSupported) {
                sourceSet sourceSets.bench
            }
        }
    }

    runs {
        named('client') {
            client()
            configName = "Fabric Client (${project.name})"
            ideConfigGenerated true
            runDir = gameDirPath

            harnessSystemProperties.each { name, value -> property(name.toString(), value.toString()) }
            harnessEnvironment.each { name, value -> environmentVariable(name.toString(), value.toString()) }
            if (!harnessProgramArgs.isEmpty()) {
                programArgs(harnessProgramArgs)
            }
            harnessJvmArgs.each { vmArg(it.toString()) }
        }
        named('server') {
            server()
            configName = "Fabric Server (${project.name})"
            ideConfigGenerated true
            runDir = gameDirPath
        }
    }
}

def mixinConfigs = ['gemrender.mixins.json']
if (direct_supported.toBoolean()) {
    mixinConfigs += "gemrender.${directMixinSet}.mixins.json"
}
if (lights_supported.toBoolean()) {
    mixinConfigs += 'gemrender.light.mixins.json'
}
if (irisSupported) {
    mixinConfigs += 'gemrender.iris.mixins.json'
}
if (irisSupported && irisflw_version) {
    mixinConfigs += 'gemrender.irisflw.mixins.json'
}
if (irisSupported && colorwheel_version) {
    mixinConfigs += 'gemrender.colorwheel.mixins.json'
}
if (flywheelVendored) {
    mixinConfigs += ['flywheel.backend.mixins.json', 'flywheel.impl.mixins.json', 'flywheel.impl.fabric.mixins.json']
}

fabricMetadata.configure {
    def tokens = [
            'mod_id'                 : mod_id,
            'mod_version'            : mod_version,
            'mod_license'            : mod_license,
            'minecraft_version_range': minecraft_version_range,
            'java_version'           : java_version,
            'flywheel_version_range' : flywheel_fabric_version_range,
            'mixin_configs'          : mixinConfigs.collect { "\"${it}\"" }.join(', '),
            'flywheel_vendored'      : flywheelVendored,
            'flywheel_vendored_version': flywheel_vendored_version
    ]

    // The expanded values have to be declared as an input or Gradle cannot see them change: the
    // template file is the only tracked input, so flipping direct_supported leaves an UP-TO-DATE
    // fabric.mod.json naming the mixin configs of the previous build. That failure is silent -- the
    // mod loads, the subsystem is simply never mixed in.
    inputs.property 'metadataTokens', tokens.collectEntries { key, value -> [key, value.toString()] }

    filesMatching('fabric.mod.json') {
        expand(tokens)
    }
}

tasks.named('processResources', ProcessResources) {
    filesMatching('*.mixins.json') {
        filter { String line -> line.replace('"JAVA_21"', "\"JAVA_${java_version}\"") }
    }
    filesMatching('gemrender.direct26.mixins.json') {
        filter { String line -> line.contains('"EquipmentLayerRendererMixin"') ? null : line }
    }
    // As in build.gradle: the draw-buffer reset it follows is 26.2's.
    if (!stonecutter.eval(mcVersion, '>=26.2')) {
        filesMatching('gemrender.light.mixins.json') {
            filter { String line -> line.contains('"GlCommandEncoderMixin"') ? null : line }
        }
    }
}

// Loom's runClient takes the harness for free -- sourceSets.harness.output carries its own
// builtBy -- but nothing links the shader staging to it, so say so.
tasks.matching { it.name.startsWith('runClient') }.configureEach {
    dependsOn tasks.named('prepareRunMods')
    if (benchEnabled && benchSupported) {
        dependsOn tasks.named('benchClasses')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

test {
    useJUnitPlatform()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The same publication and repository build.gradle registers.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = "gemrender-${project.name}"
            version = "${project.version}-SNAPSHOT"
        }
    }
    repositories {
        maven {
            name = 'WarfactorySnapshots'
            url = 'https://repo.warfactory.co/snapshots'
            credentials {
                username = project.findProperty('warfactoryUser') ?: System.getenv('WARFACTORY_MAVEN_USER')
                password = project.findProperty('warfactoryToken') ?: System.getenv('WARFACTORY_MAVEN_TOKEN')
            }
        }
    }
}
