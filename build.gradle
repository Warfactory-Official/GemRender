    }
}

// Minecraft shows the accessibility onboarding screen once per fresh game directory, before the
// title screen, and only writes onboardAccessibility:false after it has been dismissed. Every
// harness row runs in a directory that did not exist a moment ago, so every row would sit on that
// screen instead of the title screen the world bootstrap waits for. Seeding the one line ahead of
// launch is what makes a fresh run directory behave like a returning one; anything already there
// is left alone so a hand-edited options.txt survives.
tasks.named('runClient') {
    doFirst {
        def dir = project.file(project.hasProperty('runDir')
                ? project.property('runDir').toString() : 'run')
        dir.mkdirs()
        def options = new File(dir, 'options.txt')
        if (!options.exists()) {
            // The window size is pinned for the same reason: it is otherwise whatever the window
            // manager felt like, and two rows measured at 846x328 and 846x503 differ by half again
            // as many fragments before either one draws anything. -PrunWidth/-PrunHeight override.
            def w = project.hasProperty('runWidth') ? project.property('runWidth') : 1280
            def h = project.hasProperty('runHeight') ? project.property('runHeight') : 720
            options.text = "onboardAccessibility:false\noverrideWidth:${w}\noverrideHeight:${h}\n"
        }
    }
}
