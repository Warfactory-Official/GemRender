plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'

    id 'net.neoforged.moddev' version '2.0.146' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.146' apply false
    // Fabric Loom, applied by build.fabric.gradle on a node whose loader is 'fabric'. The
    // back-compat wrapper picks the right Loom variant per era: below 26.1 Minecraft is obfuscated
    // and mod dependencies have to be remapped, at 26.1 and above they already read in Mojang names.
    id 'dev.kikugie.loom-back-compat' version '0.4.2' apply false
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

def mcVersion = stonecutter.current.version

// Fabric is built by Loom, whose DSL has nothing in common with ModDevGradle's -- no `mods {}`, no
// `runs {}`, no `addModdingDependenciesTo`. Rather than thread a third branch through every one of
// those blocks, a Fabric node hands off to its own script and this one returns untouched, so the
// Forge and NeoForge builds are byte-identical to what they were before Fabric existed.
if (loader == 'fabric') {
    apply from: "${rootProject.projectDir}/build.fabric.gradle"
    return
}

def isLegacy = loader == 'forge'
if (loader != 'forge' && loader != 'neoforge') {
    throw new GradleException("versions/${mcVersion}/gradle.properties: loader='${loader}', expected 'forge', 'neoforge' or 'fabric'")
}
apply plugin: isLegacy ? 'net.neoforged.moddev.legacyforge' : 'net.neoforged.moddev'

def modding = isLegacy ? legacyForge : neoForge

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

def repoRoot = rootProject.projectDir
def runDir = rootProject.file(
        project.hasProperty('runDir') ? project.property('runDir').toString() : run_dir)

def irisSupported = iris_supported.toBoolean()

// Iris and Sodium ship under different names on Forge: Oculus is the Iris port and Embeddium the
// Sodium one, same classes and same package names underneath. Only a node that needs the other pair
// sets these.
def sodiumProject = project.findProperty('sodium_project') ?: 'sodium'
def irisProject = project.findProperty('iris_project') ?: 'iris'
def harnessSupported = harness_supported.toBoolean()
def benchSupported = bench_supported.toBoolean()

def flywheelVendored = flywheel_vendored.toBoolean()

def waterSupported = water_supported.toBoolean()

def directSupported = direct_supported.toBoolean()

def lightsSupported = lights_supported.toBoolean()
def uiSupported = ui_supported.toBoolean()
def directMixinSet = stonecutter.eval(mcVersion, '>=26.1') ? 'direct26' : 'direct'
def renderDocCompat = stonecutter.eval(mcVersion, '>=26.1')
def directMixinConfig = "gemrender.${directMixinSet}.mixins.json"

stonecutter.constants.match(loader, 'forge', 'neoforge', 'fabric')

stonecutter.constants.put('iris', irisSupported)
stonecutter.constants.put('water', waterSupported)
stonecutter.constants.put('direct', directSupported)
stonecutter.constants.put('lights', lightsSupported)

stonecutter.replacements.string(stonecutter.eval(mcVersion, '>=26.1')) {
    replace('ResourceLocation', 'Identifier')
    replace('com.mojang.blaze3d.platform.GlStateManager', 'com.mojang.blaze3d.opengl.GlStateManager')
    replace('net.minecraft.client.renderer.RenderType', 'net.minecraft.client.renderer.rendertype.RenderType')

    replace('net.minecraft.client.renderer.LightTexture', 'net.minecraft.util.LightCoordsUtil')
    replace('LightTexture.FULL_BRIGHT', 'LightCoordsUtil.FULL_BRIGHT')
    replace('net.minecraft.client.GraphicsStatus', 'net.minecraft.client.GraphicsPreset')
    replace('options.graphicsMode()', 'options.graphicsPreset()')
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'createmod maven'
        url = 'https://maven.createmod.net'
        content { includeGroupAndSubgroups 'dev.engine-room' }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

def benchEnabled = project.hasProperty('bench') || project.hasProperty('rival')
if (benchEnabled && !bench_supported.toBoolean()) {
    // Thrown when this node's client starts, NOT while it is configured. A -P flag reaches every
    // subproject Gradle configures, not only the one being run, so throwing here refused `-Pbench`
    // on 1.21.1 -- the one node that supports it -- because configuring 1.20.1 threw first.
    tasks.matching { it.name.startsWith('runClient') }.configureEach {
        doFirst {
            throw new GradleException("-Pbench/-Prival: the cross-framework benchmark is not ported "
                    + "to Minecraft ${stonecutter.current.version}. Run it on a version whose "
                    + "bench_supported is true, or see gemrender-internal/docs/MULTIVERSION.md.")
        }
    }
}
def rivalName = project.hasProperty('rival') ? project.property('rival').toString() : null

def internalDir = rootProject.file(project.findProperty('internalDir') ?: '../gemrender-internal')
def internalRivals = new File(internalDir, 'libs-rivals')

sourceSets {
    bench {}
    harness {}

    flywheel {}
}

if (!harness_supported.toBoolean()) {
    sourceSets.harness.java.setSrcDirs([])
    sourceSets.harness.resources.setSrcDirs([])
}
if (!bench_supported.toBoolean()) {
    sourceSets.bench.java.setSrcDirs([])
    sourceSets.bench.resources.setSrcDirs([])
}
if (!flywheel_vendored.toBoolean()) {
    sourceSets.flywheel.java.setSrcDirs([])
    sourceSets.flywheel.resources.setSrcDirs([])
}

if (isLegacy) {
    legacyForge.version = forge_version
} else {
    neoForge.version = project.neo_version
}

ext.harnessRunDir = runDir
ext.harnessRenderDocCompat = renderDocCompat
apply from: "${rootProject.projectDir}/gradle/harness-run.gradle"

modding.with {

    if (parchment_minecraft_version) {
        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main

            if (flywheelVendored) {
                sourceSet sourceSets.flywheel
            }
            if (harnessSupported) {
                sourceSet sourceSets.harness
            }

            if (benchEnabled && benchSupported) {
                sourceSet sourceSets.bench
            }
        }
    }

    addModdingDependenciesTo(sourceSets.bench)
    addModdingDependenciesTo(sourceSets.harness)

    if (flywheelVendored) {
        addModdingDependenciesTo(sourceSets.flywheel)
    }

    if (!isLegacy) {
        unitTest {
            enable()
            testedMod = mods."${mod_id}"
        }
    } else {
        addModdingDependenciesTo(sourceSets.test)
    }

    runs {
        client {
            client()

            harnessSystemProperties.each { name, value -> systemProperty name, value }
            harnessEnvironment.each { name, value -> environment name, value }
            if (!harnessProgramArgs.isEmpty()) {
                programArguments.addAll harnessProgramArgs
            }
            if (!harnessJvmArgs.isEmpty()) {
                jvmArguments.addAll harnessJvmArgs
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty gametest_namespaces_property, project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty gametest_namespaces_property, project.mod_id
        }

        data {
            data()
            gameDirectory = rootProject.file(run_data_dir)
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', new File(repoRoot, 'src/generated/resources').absolutePath,
                    '--existing', new File(repoRoot, 'src/main/resources').absolutePath
        }

        configureEach {

            gameDirectory = runDir

            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG

        }
    }

}

// Reads the main resources (access transformers) stonecutterGenerate writes.
tasks.named('createMinecraftArtifacts') { dependsOn tasks.named('stonecutterGenerate') }

sourceSets {
    ktxTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

sourceSets {
    main {
        resources {
            srcDir new File(internalDir, 'resources')
        }
    }
}
tasks.named('jar') {
    exclude 'assets/gemrender/models/vehicles/**'

    if (flywheelVendored) {
        from sourceSets.flywheel.output
    }
}

// Fabric-only sources, in both source sets: the Fabric API event registrations that stand in for the
// Forge/NeoForge annotated event bus. No node built by this script is ever a Fabric node, and the
// package names net.fabricmc types that are not on the classpath here, so it never reaches javac.
//
// A whole package rather than a `//? if fabric` guard on each file, because these files carry version
// branches of their own and Stonecutter cannot nest one commented-out block inside another: a file
// wrapped in `//? if fabric` may not contain an `//? if <1.21 { } else { }` underneath it. Excluding
// the package keeps both guards flat. build.fabric.gradle excludes the mirror image -- see the
// WaterSplitEvents and DirectEvents lines there.
sourceSets.main.java.exclude 'com/wf/gemrender/fabric/**'
sourceSets.harness.java.exclude 'com/wf/gemrender/fabric/**'
sourceSets.bench.java.exclude 'com/wf/gemrender/fabric/**'

if (!irisSupported) {
    sourceSets.main.java.exclude 'com/wf/gemrender/iris/**'
    sourceSets.main.java.exclude 'com/wf/gemrender/mixin/iris/**'
    sourceSets.main.resources.exclude 'gemrender.iris.mixins.json'
}

// Each bridge goes in only where it is resolvable. build.fabric.gradle splits these the same way and
// for the same reason: 1.20.1 has no iris-flw-compat on one loader and none of Colorwheel on
// another, and a mixin config naming a class that was never compiled is a hard load failure.
if (!irisSupported || !irisflw_version) {
    sourceSets.main.java.exclude 'com/wf/gemrender/mixin/irisflw/**'
    sourceSets.main.resources.exclude 'gemrender.irisflw.mixins.json'
}

if (!irisSupported || !colorwheel_version) {
    sourceSets.main.java.exclude 'com/wf/gemrender/mixin/colorwheel/**'
    sourceSets.main.resources.exclude 'gemrender.colorwheel.mixins.json'
}

['direct', 'direct26'].each { set ->
    if (!directSupported || set != directMixinSet) {
        sourceSets.main.java.exclude "com/wf/gemrender/mixin/${set}/**"
        sourceSets.main.resources.exclude "gemrender.${set}.mixins.json"
    }
}

if (!lightsSupported) {
    sourceSets.main.java.exclude 'com/wf/gemrender/light/**'
    sourceSets.main.java.exclude 'com/wf/gemrender/mixin/light/**'
    sourceSets.main.resources.exclude 'gemrender.light.mixins.json'
    sourceSets.test.java.exclude 'com/wf/gemrender/light/**'
    sourceSets.harness.java.exclude 'com/wf/gemrender/spike/LightSpike.java'
}

if (!uiSupported) {
    sourceSets.main.java.exclude 'com/wf/gemrender/ui/**'
    sourceSets.main.java.exclude 'com/wf/gemrender/mixin/ui/**'
    sourceSets.main.resources.exclude 'gemrender.ui.mixins.json'
    sourceSets.main.resources.exclude 'assets/gemrender/shaders/ui/**'
    sourceSets.test.java.exclude 'com/wf/gemrender/ui/**'
}

if (!directSupported) {
    sourceSets.main.java.exclude 'com/wf/gemrender/direct/**'

    // The item the direct path hands the player and the two models that dress it belong to that path,
    // not to the harness, and the harness only reaches them through it. Every NeoForge/Forge node has
    // direct on today, so this is here to stop the flag being a trap rather than because it fires.
    sourceSets.harness.java.exclude 'com/wf/gemrender/spike/DirectSpike.java'
    sourceSets.harness.java.exclude 'com/wf/gemrender/spike/SpikeItem.java'
    sourceSets.harness.java.exclude 'com/wf/gemrender/spike/SpikeItems.java'
    sourceSets.harness.java.exclude 'com/wf/gemrender/spike/SpikeItemEvents.java'
    sourceSets.harness.resources.exclude 'assets/gemrender/items/**'
    sourceSets.harness.resources.exclude 'assets/gemrender/models/item/**'
}

if (harnessSupported) {
    if (stonecutter.eval(mcVersion, '>=26.1')) {
        sourceSets.harness.resources.exclude 'assets/gemrender/models/item/spike.json'
    } else {
        sourceSets.harness.resources.exclude 'assets/gemrender/items/**'
        sourceSets.harness.resources.exclude 'assets/gemrender/models/item/spike_base.json'
    }
}

tasks.named('processResources', ProcessResources) {
    filesMatching('*.mixins.json') {
        filter { String line -> line.replace('"JAVA_21"', "\"JAVA_${java_version}\"") }
    }
}

if (flywheelVendored) {
    tasks.named('processFlywheelResources', ProcessResources) {
        filesMatching('*.mixins.json') {
            filter { String line ->
                line.contains('"refmap"') ? null
                        : line.replace('"JAVA_21"', "\"JAVA_${java_version}\"")
                              .replace('"JAVA_17"', "\"JAVA_${java_version}\"")
            }
        }
    }
}

if (isLegacy) {

    def mixinConfigs = ['gemrender.mixins.json']
    if (directSupported) {
        mixinConfigs += directMixinConfig
    }
    if (irisSupported) {
        mixinConfigs += 'gemrender.iris.mixins.json'
    }
    if (irisSupported && irisflw_version) {
        mixinConfigs += 'gemrender.irisflw.mixins.json'
    }
    if (irisSupported && colorwheel_version) {
        mixinConfigs += 'gemrender.colorwheel.mixins.json'
    }

    dependencies {
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }

    def refmap = 'gemrender.refmap.json'

    mixin {

        add sourceSets.main, refmap

        mixinConfigs.each { config it }
    }

    // MDG Legacy writes no "refmap" key; absent => Mixin reads mixin.refmap.json, every SRG lookup misses in production.
    tasks.named('processResources', ProcessResources) {
        filesMatching('*.mixins.json') {
            filter { String line -> line.trim().startsWith('"package"') ? "${line}\n  \"refmap\": \"${refmap}\"," : line }
        }
    }

    tasks.named('jar', Jar) {
        manifest.attributes(['MixinConfigs': mixinConfigs.join(',')])
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime

    shaderMod

    sodiumMod

    // The Colorwheel bridge, resolved only when -Pcolorwheel asks for it: it and iris-flw-compat do
    // the same job and cannot be installed together.
    colorwheelMod
}

// Shipped lwjgl-ktx: module-info `requires transitive org.lwjgl`; dedicated server has no org.lwjgl =>
// FML module resolution fails. Jar-in-jar copy = automatic module org.lwjgl.ktx (no requires); its
// classes link only on the client.
def ktxAutomatic = Attribute.of('gemrender.ktxAutomaticModule', Boolean)

abstract class KtxAutomaticModule implements TransformAction<org.gradle.api.artifacts.transform.TransformParameters.None> {
    @InputArtifact
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        def input = inputArtifact.get().asFile
        if (!(input.name ==~ /lwjgl-ktx-[0-9.]+\.jar/)) {
            outputs.file(input)
            return
        }
        def output = outputs.file(input.name)
        new java.util.zip.ZipFile(input).withCloseable { zip ->
            new java.util.zip.ZipOutputStream(output.newOutputStream()).withCloseable { out ->
                zip.entries().each { e ->
                    if (e.name.endsWith('module-info.class')) return
                    out.putNextEntry(new java.util.zip.ZipEntry(e.name))
                    if (e.name == 'META-INF/MANIFEST.MF') {
                        def mf = new java.util.jar.Manifest(zip.getInputStream(e))
                        mf.mainAttributes.putValue('Automatic-Module-Name', 'org.lwjgl.ktx')
                        mf.write(out)
                    } else {
                        out << zip.getInputStream(e)
                    }
                    out.closeEntry()
                }
            }
        }
    }
}

configurations.named('jarJar') { attributes.attribute(ktxAutomatic, true) }

def flywheelDep = flywheelVendored ? null : "dev.engine-room.flywheel:${flywheel_artifact}:${flywheel_version}"
def modConf = { String name -> isLegacy ? "mod${name.capitalize()}" : name }

if (isLegacy) {

    ['localRuntime', 'benchCompileOnly', 'harnessCompileOnly', 'testImplementation'].each {
        obfuscation.createRemappingConfiguration(configurations.getByName(it))
    }
}

dependencies {
    if (flywheelVendored) {

        compileOnly sourceSets.flywheel.output

        runtimeOnly sourceSets.flywheel.output
    } else {

        add(modConf('compileOnly'), flywheelDep)

        add(modConf('localRuntime'), flywheelDep)

        jarJar("dev.engine-room.flywheel:${flywheel_artifact}") {
            version {
                strictly flywheel_version_range
                prefer flywheel_version
            }
            transitive = false
        }
    }

    // ktx_version may exceed lwjgl_version: struct classes + natives only; calls via Libktx (libffi).
    compileOnly("org.lwjgl:lwjgl-ktx:${ktx_version}") { transitive = false }

    def ktxRuntime = stonecutter.eval(mcVersion, '>=26.1') ? 'runtimeOnly' : 'additionalRuntimeClasspath'
    add(ktxRuntime, "org.lwjgl:lwjgl-ktx:${ktx_version}") { transitive = false }
    jarJar("org.lwjgl:lwjgl-ktx:${ktx_version}") { transitive = false }

    for (platform in ['natives-linux', 'natives-windows', 'natives-macos', 'natives-macos-arm64']) {
        add(ktxRuntime, "org.lwjgl:lwjgl-ktx:${ktx_version}:${platform}") { transitive = false }
        jarJar("org.lwjgl:lwjgl-ktx:${ktx_version}:${platform}") { transitive = false }
    }

    attributesSchema { attribute(ktxAutomatic) }
    artifactTypes.getByName('jar').attributes.attribute(ktxAutomatic, false)
    registerTransform(KtxAutomaticModule) {
        from.attribute(ktxAutomatic, false).attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
        to.attribute(ktxAutomatic, true).attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
    }

    if (project.findProperty('sodium_standalone_version')) {
        sodiumMod("maven.modrinth:sodium:${sodium_standalone_version}") { transitive = false }
    }

    if (irisSupported) {
        shaderMod("maven.modrinth:${sodiumProject}:${sodium_version}") { transitive = false }
        shaderMod("maven.modrinth:${irisProject}:${iris_version}") { transitive = false }

        if (irisflw_version) {
            shaderMod("maven.modrinth:iris-flw-compat:${irisflw_version}") { transitive = false }
        }

        if (colorwheel_version) {
            colorwheelMod("maven.modrinth:colorwheel:${colorwheel_version}") { transitive = false }
        }

        compileOnly("maven.modrinth:${irisProject}:${iris_version}") { transitive = false }
        // Iris jar-in-jars it; the guest transform parses Iris's patched output with it.
        compileOnly("io.github.douira:glsl-transformer:${glsl_transformer_version}") { transitive = false }

        // The bridges are compiled against, not only staged: on the legacy node Mixin's annotation
        // processor resolves `targets = "..."` at compile time and fails the build when the named
        // class is not on the classpath, even with remap = false. Harmless on the others.
        if (irisflw_version) {
            compileOnly("maven.modrinth:iris-flw-compat:${irisflw_version}") { transitive = false }
        }
        if (colorwheel_version) {
            compileOnly("maven.modrinth:colorwheel:${colorwheel_version}") { transitive = false }
        }
    }

    benchCompileOnly sourceSets.main.output
    benchCompileOnly sourceSets.harness.output
    if (flywheelVendored) {
        benchCompileOnly sourceSets.flywheel.output
    } else {
        add(modConf('benchCompileOnly'), flywheelDep)
    }
    benchCompileOnly fileTree(dir: internalRivals, include: '*.jar')

    harnessCompileOnly sourceSets.main.output
    if (flywheelVendored) {
        harnessCompileOnly sourceSets.flywheel.output
    } else {
        add(modConf('harnessCompileOnly'), flywheelDep)
    }

    def rivalJars = [
            mcgltf  : ['mcgltf'],
            geckolib: ['geckolib'],
            sbm     : ['simplebedrockmodel', 'mae'],
    ]
    if (rivalName != null) {
        def wanted = rivalJars[rivalName]
        if (wanted == null) {
            throw new GradleException("-Prival=${rivalName}: unknown framework. Have: ${rivalJars.keySet()}")
        }
        def available = fileTree(dir: internalRivals, include: '*.jar')
        wanted.each { prefix ->
            def jar = available.find { it.name.startsWith(prefix) }
            if (jar == null) {
                throw new GradleException("-Prival=${rivalName}: no jar starting '${prefix}' in "
                        + "${internalRivals}. Have: " + available.collect { it.name })
            }
            localRuntime files(jar)
            logger.lifecycle "Rival framework: ${jar.name}"
        }
    }

    if (flywheelVendored) {
        testImplementation sourceSets.flywheel.output
    } else {
        add(modConf('testImplementation'), flywheelDep)
    }

    ktxTestImplementation platform('org.junit:junit-bom:5.11.3')
    ktxTestImplementation 'org.junit.jupiter:junit-jupiter'
    ktxTestImplementation 'org.assertj:assertj-core:3.26.3'
    ktxTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    ktxTestImplementation "org.lwjgl:lwjgl:${lwjgl_version}"
    ktxTestImplementation("org.lwjgl:lwjgl-ktx:${ktx_version}") { transitive = false }
    for (platform in ['natives-linux', 'natives-windows', 'natives-macos', 'natives-macos-arm64']) {
        ktxTestRuntimeOnly "org.lwjgl:lwjgl:${lwjgl_version}:${platform}"
        ktxTestRuntimeOnly("org.lwjgl:lwjgl-ktx:${ktx_version}:${platform}") { transitive = false }
    }

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'gl'

        if (isLegacy) {
            excludeTags 'bootstrap'
        }
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = project.hasProperty('analysisModel')
    }

    ['analysisModel'      : 'gemrender.analysis.model',
     'analysisAnimation'  : 'gemrender.analysis.animation',
     'analysisGameplay'   : 'gemrender.analysis.gameplayBones',
     'analysisFleet'      : 'gemrender.analysis.fleet',
     'blendBench'         : 'gemrender.bench.blend'].each { property, key ->
        if (project.hasProperty(property)) {
            systemProperty key, project.property(property).toString()
        }
    }
}

tasks.register('ktxTest', Test) {
    group = 'verification'
    description = 'KTX2 decoding, against files encoded by the same library in the same process.'
    testClassesDirs = sourceSets.ktxTest.output.classesDirs
    classpath = sourceSets.ktxTest.runtimeClasspath
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}
tasks.named('check') { dependsOn tasks.named('ktxTest') }

def glslValidator = new File(internalDir, 'scripts/validate-glsl.sh')
tasks.register('validateGlsl', Exec) {
    group = 'verification'
    description = 'Compiles every shipped shader with the Khronos reference compiler.'

    commandLine glslValidator.path, repoRoot.path
    workingDir repoRoot
    onlyIf {
        if (!glslValidator.isFile()) {
            logger.lifecycle "validateGlsl: no ${glslValidator}, skipping."
            return false
        }
        return true
    }
}
tasks.named('check') { dependsOn tasks.named('validateGlsl') }

tasks.register('glTest', Test) {
    group = 'verification'
    description = 'GPU tests against a real OpenGL context. Requires a working GL 4.6 driver.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'gl'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = true
    }

    maxParallelForks = 1

    environment 'MESA_GL_VERSION_OVERRIDE', '4.6'

    if (project.hasProperty('software')) {
        environment 'LIBGL_ALWAYS_SOFTWARE', '1'
        environment 'GALLIUM_DRIVER', 'llvmpipe'
    }
}

afterEvaluate {

    tasks.matching { it.name == 'runClient' }.configureEach {
        dependsOn tasks.named('prepareRunMods')

        dependsOn tasks.named('harnessClasses')
        if (benchEnabled) {
            dependsOn tasks.named('benchClasses')
        }
    }

    def unitTest = tasks.named('test', Test).get()
    tasks.named('glTest', Test).configure { glTest ->
        glTest.dependsOn unitTest.dependsOn
        glTest.workingDir = unitTest.workingDir
        glTest.jvmArgs = unitTest.jvmArgs
        glTest.systemProperties.putAll(unitTest.systemProperties)
        glTest.jvmArgumentProviders.addAll(unitTest.jvmArgumentProviders)
        glTest.doFirst {

            glTest.workingDir.mkdirs()
        }
    }
}

tasks.register('makeKtxAssets', JavaExec) {
    group = 'build'
    description = 'Regenerates the .ktx2 test textures from the PNGs beside them.'
    classpath = sourceSets.ktxTest.runtimeClasspath

    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version as int) }
    mainClass = 'com.wf.gemrender.texture.MakeKtxAssets'
    args repoRoot.absolutePath
    dependsOn tasks.named('ktxTestClasses')
}

// The shader stack: which of iris-flw-compat and Colorwheel bridges Flywheel to Iris, what lands in
// run/mods, and what run/config/iris.properties says. Shared with build.fabric.gradle -- the mods
// are the same Modrinth projects on both loaders and the staging is identical, so only the two
// configurations they resolve through differ, and those stay in each buildscript.
ext.shaderRunDir = runDir
ext.shaderInternalDir = internalDir
apply from: "${rootProject.projectDir}/gradle/shader-mods.gradle"

def renderDocCaptureDir = new File(runDir, 'renderdoc')
def renderDocXmlDir = layout.buildDirectory.dir('renderdoc')

def apitraceFile = new File(runDir, 'apitrace/gemrender.trace')

tasks.register('apitraceDump', Exec) {
    group = 'verification'
    description = 'Dumps the GL call list of the newest apitrace capture to build/apitrace/gemrender.txt.'

    doFirst {
        if (!apitraceFile.isFile()) {
            throw new GradleException("No trace at ${apitraceFile}. Run `./gradlew :${mcVersion}:runClient " +
                    "-PwithApitrace ...` first (see gemrender-internal/docs/TESTING.md).")
        }
        def outDir = layout.buildDirectory.dir('apitrace').get().asFile
        outDir.mkdirs()
        def outFile = new File(outDir, 'gemrender.txt')
        logger.lifecycle "apitrace: dumping ${apitraceFile.name} -> ${outFile}"
        standardOutput = new FileOutputStream(outFile)
        commandLine 'apitrace', 'dump', apitraceFile.absolutePath
    }
}

tasks.register('renderDocConvert', Exec) {
    group = 'verification'
    description = 'Converts the newest RenderDoc capture in run/renderdoc to XML for assertions.'
    outputs.dir renderDocXmlDir

    doFirst {
        def captures = renderDocCaptureDir.listFiles({ f -> f.name.endsWith('.rdc') } as FileFilter)
        if (captures == null || captures.length == 0) {
            throw new GradleException("No .rdc captures in ${renderDocCaptureDir}. Run `./gradlew runClient -PwithRenderDoc` and trigger a capture first (see gemrender-internal/docs/TESTING.md).")
        }
        def newest = captures.toList().max { it.lastModified() }
        def outDir = renderDocXmlDir.get().asFile
        outDir.mkdirs()
        def outFile = new File(outDir, newest.name.replaceFirst(/\.rdc$/, '.xml'))
        logger.lifecycle "RenderDoc: converting ${newest.name} -> ${outFile}"
        commandLine 'renderdoccmd', 'convert', '-f', newest.absolutePath, '-o', outFile.absolutePath, '-c', 'xml'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            loader_version_range   : loader_version_range,
            platform_version_range : platform_version_range,
            flywheel_version_range : flywheel_version_range,

            flywheel_dependency    : !flywheelVendored,

            direct_path            : directSupported,
            direct_config          : directMixinConfig,
            light_path             : lightsSupported,
            ui_path                : uiSupported,
            iris_path              : irisSupported,

            flywheel_vendored_version: flywheel_vendored_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties

    from new File(repoRoot, "src/main/templates/${loader}")
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
modding.ideSyncTask generateModMetadata

