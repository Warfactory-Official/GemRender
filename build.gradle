tasks.named('runClient') {
    doFirst {
        def dir = runDir
        dir.mkdirs()
        def options = new File(dir, 'options.txt')
        if (!options.exists()) {

            def w = project.hasProperty('runWidth') ? project.property('runWidth') : 1280
            def h = project.hasProperty('runHeight') ? project.property('runHeight') : 720
            options.text = "onboardAccessibility:false\noverrideWidth:${w}\noverrideHeight:${h}\n"
        }
    }
}
