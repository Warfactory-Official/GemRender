// The -P flag surface of the spike harness.
//
// Applied by build.gradle and by build.fabric.gradle both. ModDevGradle and Loom describe a dev run
// with different DSLs -- `systemProperty`/`programArguments`/`environment` against `property`/
// `programArgs`/`environmentVariable` -- but the flags themselves are the harness's, not the
// loader's, and there are ninety of them. Kept apart so a flag added for one loader cannot go
// missing on the other; each build script applies the three collections in its own dialect.
//
// Inputs, set by the caller before `apply from:`, because a `def` in the calling script is not
// visible here:
//   harnessRunDir          the run directory, for the capture paths
//   harnessRenderDocCompat true where RenderDoc is known not to be able to capture this version

