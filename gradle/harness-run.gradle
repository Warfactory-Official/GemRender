if (project.hasProperty('withRenderDoc')) {
    def rdLib = file(project.renderdoc_lib)
    if (!rdLib.exists()) {
        throw new GradleException("-PwithRenderDoc: ${rdLib} not found. Install renderdoc, or pass -Prenderdoc_lib=<path to librenderdoc.so>.")
    }
    env.put 'LD_PRELOAD', rdLib.absolutePath

    env.put 'GEMRENDER_RENDERDOC_CAPTURE_PATH', new File(runDir, 'renderdoc/gemrender').absolutePath

    // GLFW picks GLX or EGL per platform; RenderDoc has to hook whichever one carries the
    // context. Default off because GLX is what the X11 sessions here use, and hooking EGL
    // as well makes RenderDoc attach to the wrong one. -PrenderDocEgl=1 flips it.
    env.put 'RENDERDOC_HOOK_EGL',
            project.findProperty('renderDocEgl')?.toString() ?: '0'

    if (renderDocCompat) {
        logger.warn "RenderDoc cannot capture ${minecraft_version}: its GL layer refuses " +
                "blaze3d's buffer maps (checked against 1.45 and 1.46). Use -PwithApitrace."
    }

    logger.lifecycle "RenderDoc: preloading ${rdLib}, captures -> ${new File(runDir, 'renderdoc')}"
}

// apitrace is the other frame capture, and the one that works at and above 26.1: it is a
// call recorder rather than a shadow-state layer, so blaze3d's mapped buffers do not
// defeat it. One trace per run, replayed and dumped afterwards with `apitraceDump`.
if (project.hasProperty('withApitrace')) {
    if (project.hasProperty('withRenderDoc')) {
        throw new GradleException('-PwithApitrace and -PwithRenderDoc both set LD_PRELOAD. ' +
                'Pick one.')
    }
    def wrapper = file(project.findProperty('apitrace_lib')
            ?: '/usr/lib/apitrace/wrappers/glxtrace.so')
    if (!wrapper.exists()) {
        throw new GradleException("-PwithApitrace: ${wrapper} not found. Install apitrace, or " +
                "pass -Papitrace_lib=<path to glxtrace.so>.")
    }
    def traceFile = new File(runDir, 'apitrace/gemrender.trace')
    traceFile.parentFile.mkdirs()
    env.put 'LD_PRELOAD', wrapper.absolutePath
    env.put 'TRACE_FILE', traceFile.absolutePath
    logger.lifecycle "apitrace: preloading ${wrapper}, trace -> ${traceFile}"
}

