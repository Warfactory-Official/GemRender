# The Gradle daemon's own JVM, which is NOT the same thing as the toolchain the code compiles with.
#
# Stonecutter 0.9.8 is compiled for JVM 21 and its plugin is loaded into the daemon, so the daemon
# itself must be 21+ -- this build previously ran its daemon on 17 and let ModDevGradle provision a
# 21 toolchain for compilation, which is no longer enough.
#
# Compilation is unaffected: java.toolchain in build.gradle still asks for 17 on 1.20.1 and 21 on
# 1.21.1, and Gradle provisions those independently of the daemon.
toolchainVersion=21
