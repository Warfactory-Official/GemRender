# The retained item/armour/hand path runs here. Its renderer, its passes and all four of its mixins
# are loader-neutral -- the mixins target vanilla, not the loader -- and the only Forge/NeoForge part
# was DirectEvents, whose stage handlers carried no event data at all; LevelStageHooks flushes at the
# Fabric API equivalents instead. What is missing is the spike ITEM: it is registered through
# RegisterEvent and bound to its renderer through IClientItemExtensions, so -Pdirectitem and
# -Pdirecttotem are out, and -Pdirecthand with them, Fabric having no hand-render event to submit
# from. -Pdirect, -Pdirectspread, -Pdirectarmor, -Pdirectstats and the rest all work.
direct_supported=true

# The spike harness runs here. Its loader-coupled wirings -- client tick, HUD, commands and the
# direct spike's world-render hook -- have Fabric API counterparts, and without it the node compiles
# but cannot be pointed at a scene.
harness_supported=true

# The cross-framework rivals are NeoForge mods.
# Of the three rival frameworks only GeckoLib publishes a 1.21.1 Fabric build, so this node runs
# -Prival=geckolib and nothing else. A Modrinth version ID rather than a number, because the number
# is the same on every loader's build of a release.
#
# 4.8.4, not the 4.9.2 the NeoForge node measures: every GeckoLib from 4.9 on is built with Loom
# 1.17 and carries Fabric-Loom-Mixin-Remap-Type: static, which Loom 1.16.3 refuses to read at all
# ("Mod was built with a newer version of Loom"). 4.8.4 is the newest that is built with Loom 1.10
# and marked `mixin`. Compare GemRender to GeckoLib within a node, never a GeckoLib column across.
geckolib_version=3GjkJptS
bench_supported=true
version_buildable=true

# The water/cloud split runs here. It reads a LevelStage rather than a RenderLevelStageEvent, and
# LevelStageHooks fills one from the Fabric API world-render events: AFTER_ENTITIES lands on the
# same instruction the NeoForge stage does, AFTER_TRANSLUCENT and LAST a little later than their
# counterparts. See gemrender-internal/docs/MULTIVERSION.md for what that costs.
water_supported=true
lights_supported=true
ui_supported=false
