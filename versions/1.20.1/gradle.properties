# The shader path COMPILES here and is off for a reason that is nothing to do with GemRender: a
# released Forge 1.20.1 mod cannot be loaded into a ModDevGradle dev run at all. Set the four
# versions below and this node builds clean -- Oculus is the Iris port, Embeddium the Sodium one,
# both keep the upstream package names, and IrisPbrLoader's //? if >=1.21 guard covers the one thing
# that moved (net.irisshaders.iris.texture.pbr.loader here, net.irisshaders.iris.pbr there). The
# client then dies in Oculus's own mixins: "@Shadow field f_117950_ was not located in the target
# class net.minecraft.client.renderer.texture.AbstractTexture". Forge 1.20.1 runs the GAME in SRG
# names, so released mods carry SRG member names in their bytecode, and a dev run is in official
# names. mixin.env.refMapRemappingFile does not reach it: a refmap rewrites @At targets, not the
# @Shadow field names the mixin class literally declares. NeoForge 1.21.1 has no such split, which
# is why the same stack stages there. See gemrender-internal/docs/MULTIVERSION.md.
#
#     iris_supported=true
#     sodium_project=embeddium  iris_project=oculus
#     sodium_version=UTbfe5d1   iris_version=iQ1SwGc3
#     irisflw_version=dE1A45cG  colorwheel_version=RwUrKFGe
