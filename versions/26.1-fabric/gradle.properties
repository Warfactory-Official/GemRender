minecraft_version=26.1.2
minecraft_version_range=>=26.1.2 <26.2
java_version=25

loader=fabric
fabric_loader_version=0.19.5
fabric_api_version=0.155.3+26.1.2
platform_version_range=[0.19,)
loader_version_range=[0,)

parchment_minecraft_version=
parchment_mappings_version=

# Upstream Flywheel's 26.1 build, nested like the older Fabric nodes. src/flywheel (the earlier fork) is unused here.
flywheel_vendored=false
flywheel_artifact=flywheel-fabric
flywheel_version=1.0.7-mc26.1-16
flywheel_version_range=[1.0.7-mc26.1-16,2.0)
flywheel_fabric_version_range=>=1.0.7 <2.0

flywheel_vendored_version=
# Golem Core before this calls the old fork's Flywheel API, which upstream Flywheel lacks: refuse it.
golemcore_floor=1.0.6

lwjgl_version=3.4.1
ktx_version=3.4.1

# No Iris/Sodium build for 26.1 that GemRender's bridges target, as on the 26.1 NeoForge node.
iris_supported=false
sodium_version=
iris_version=
irisflw_version=
colorwheel_version=

run_dir=run-26.1-fabric
run_data_dir=run-data-26.1-fabric
gametest_namespaces_property=fabric-api.gametest

# The retained item/armour/hand path. The item renderer type is registered into vanilla's special
# model renderer map (access widener) in place of NeoForge's RegisterSpecialModelRendererEvent. Armour
# has no IClientItemExtensions here: EquipmentLayerRendererMixin is left out and a mod hands
# GemRenderArmorModel to Fabric API's ArmorRenderer instead.
direct_supported=true

harness_supported=true

bench_supported=false
geckolib_version=

version_buildable=true

# Compiled, off at runtime unless -Dgemrender.watersplit=force, exactly as on 26.1 NeoForge. Fabric
# has no hook after weather, so the split's last stage runs at the end of the main pass.
water_supported=true
lights_supported=true
ui_supported=false

# Sodium alone: -Psodium stages it in dev runs, and SodiumCompat compiles against its API.
sodium_standalone_version=mc26.1.2-0.9.2-fabric
