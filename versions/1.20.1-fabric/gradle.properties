# The shader path runs here, through Colorwheel only. iris-flw-compat has no build against this
# Flywheel for 1.20.1 -- its newest Fabric release targets the old com.jozufozu.flywheel, a different
# mod -- so irisflw_version is deliberately blank and -Piris needs -Pcolorwheel on this node.
iris_supported=true
