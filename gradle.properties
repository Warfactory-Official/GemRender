# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# NeoForm setup (Minecraft decompile/recompile) is memory-hungry; keep this generous.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is OFF: it hides which task invalidated the build and interacts awkwardly with
# the custom generateModMetadata task. Same call as the sibling WF projects.
org.gradle.configuration-cache=false


## Environment Properties

# Parchment parameter-name mappings layered on official MojMap.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The Minecraft version must agree with the NeoForge version to get a valid artifact.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# NeoForge 21.1.x targets Minecraft 1.21.1. Matches the rest of the WF stack.
neo_version=21.1.248
neo_version_range=[21.1.1,22)
# The loader version range can only use the major version of FML as bounds. NeoForge FML major = 1.
loader_version_range=[1,)


## Dependency Properties

# Flywheel: Engine-Room Flywheel, NeoForge 1.21.1 variant (maven.createmod.net).
# 1.0.6 is the tagged release and is what WF-Ballistics pins; the maven also carries CI builds up to
# 1.0.6-44. Pinned to the tagged release deliberately: Flywheel is a SHARED library that Create also
# ships, so exactly one copy loads in a pack. Compiling against a newer API than the copy that ends up
# loading is how you earn a NoSuchMethodError at runtime, and GemRender compiles against Flywheel
# *internals* (not just the api jar), which move faster than the API does.
flywheel_version=1.0.6
flywheel_version_range=[1.0,2.0)


## Mod Properties

# Must be lowercase, must match the String constant in the @Mod-annotated class.
mod_id=gemrender
mod_name=GemRender
mod_license=GPL-3
mod_version=0.1.0
# Should match the base package used for the mod sources.
mod_group_id=com.wf.gemrender
mod_authors=MrNorwood
mod_description=A GPU-driven model and animation renderer for Minecraft: a glTF 2.0 asset pipeline on top of Flywheel's retained instancing, with skinning evaluated in the vertex shader so animated models stay instanced.


## Test / tooling properties

# RenderDoc in-application capture. GemRender does not link against RenderDoc; it dlopens this library
# only when it is already resident in the process (see gemrender-internal/docs/TESTING.md), so a
# normal run never touches it. Override with -Prenderdoc_lib=/path/to/librenderdoc.so if yours lives
# elsewhere.
renderdoc_lib=/usr/lib/librenderdoc.so

# The shader stack, pulled only for `-Piris` runs and never a dependency of the mod. The versions are
# not independent: iris-flw-compat 2.3.0 is built against exactly these two (its own gradle.properties
# names sodium mc1.21.1-0.6.9 and iris 1.8.8+1.21.1), and it mixes into Iris internals that move
# between Iris minors. Bump all three together or not at all.
sodium_version=mc1.21.1-0.6.9-neoforge
iris_version=1.8.8+1.21.1-neoforge
# Matches the pinned checkout in gemrender-internal/reference/iris-flw-compat, so what runs is the
# tree gemrender-internal/docs/RESEARCH.md cites line numbers against. 2.4.0 exists and is
# deliberately not used here.
irisflw_version=1.21.1+2.3.0-release

# LWJGL: pinned to the exact version Minecraft 1.21.1 ships, so the ktx module links against the same
# core (MemoryStack, MemoryUtil, the shared-library loader) the game already has on the classpath.
# Bumping this independently of Minecraft is how you get two LWJGL cores and a linkage error.
lwjgl_version=3.3.3
