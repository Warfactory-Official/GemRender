org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
moddev_version=2.0.146

dev.kikugie.stonecutter.hard_mode=true

mod_id=gemrender
mod_name=GemRender
mod_license=GPL-3
mod_version=0.1.17
mod_group_id=com.wf.gemrender
mod_authors=MrNorwood
mod_description=A GPU-driven model and animation renderer for Minecraft: a glTF 2.0 asset pipeline on top of Flywheel's retained instancing, with skinning evaluated in the vertex shader so animated models stay instanced.

renderdoc_lib=/usr/lib/librenderdoc.so

# Loom, for the Fabric nodes. dev.kikugie.loom-back-compat resolves one of two plugin ids from this
# single version: net.fabricmc.fabric-loom-remap below 26.1, net.fabricmc.fabric-loom at and above.
loomx.loom_version=1.16.3

# Release upload (gradle/publish.gradle documents every key). A blank project id skips that site. Tokens come from
# MODRINTH_TOKEN / CURSEFORGE_TOKEN or ~/.gradle/gradle.properties, never from this file.
publish_modrinth_project=mdbghNgr
publish_curseforge_project=1735539
publish_fabric_requires=fabric-api
