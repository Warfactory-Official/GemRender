name: Nightly Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :1.20.1:build :1.21.1:build :26.1:build --no-daemon --stacktrace

      - name: Publish snapshot
        env:
          WARFACTORY_MAVEN_USER: ${{ secrets.WARFACTORY_MAVEN_USER }}
          WARFACTORY_MAVEN_TOKEN: ${{ secrets.WARFACTORY_MAVEN_TOKEN }}
        run: ./gradlew :1.20.1:publish :1.21.1:publish :26.1:publish --no-daemon --stacktrace

      - name: Rebuild dependents
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.WF_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::warning::WF_DISPATCH_TOKEN unset: dependents not rebuilt"; exit 0; }
          for down in WfLib:nightly.yml:main; do
            IFS=: read -r repo wf branch <<<"$down"
            gh workflow run "$wf" -R "Warfactory-Official/$repo" --ref "$branch"
          done
