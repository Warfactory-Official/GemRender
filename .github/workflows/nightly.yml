name: Nightly Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :1.20.1:build :1.21.1:build :26.1:build --no-daemon --stacktrace

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true  # org artifact quota full => still publish
        with:
          name: gemrender-nightly-${{ github.sha }}
          path: versions/*/build/libs/*.jar
          retention-days: 14

      - name: Publish snapshot
        env:
          WARFACTORY_MAVEN_USER: ${{ secrets.WARFACTORY_MAVEN_USER }}
          WARFACTORY_MAVEN_TOKEN: ${{ secrets.WARFACTORY_MAVEN_TOKEN }}
        run: ./gradlew :1.20.1:publish :1.21.1:publish :26.1:publish --no-daemon --stacktrace
